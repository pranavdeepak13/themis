[project]
name = "themis"
version = "0.1.0"
description = "Local manager for multiple Claude Code profiles: sessions, resources, token usage and advice."
readme = "README.md"
keywords = ["claude-code", "profiles", "tokens", "textual", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "jsonschema>=4.26.0",
    "orjson>=3.10",
    "pydantic>=2.7",
    "rich>=13.7",
    "textual>=0.80",
    "textual-serve>=1.1",
    "typer>=0.12",
]

[project.scripts]
themis = "themis.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/themis"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
